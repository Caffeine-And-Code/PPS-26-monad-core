name: Publish documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Quarkdown
        run: curl -fsSL https://raw.githubusercontent.com/quarkdown-labs/get-quarkdown/refs/heads/main/install.sh | sudo env "PATH=$PATH" bash

      - name: Generate Quarkdown documentation
        run: quarkdown c docs/main.qd --out-name="documentation"

      - name: Generate Scaladoc
        run: sbt doc

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          mkdir -p _site/api
          cp -R quarkdown-output/documentation/. _site/

          SCALADOC_DIR="$(find target/out/jvm -type d -name api -print -quit)"
          if [ -z "$SCALADOC_DIR" ] || [ ! -f "$SCALADOC_DIR/index.html" ]; then
            echo "Scaladoc output not found"
            exit 1
          fi

          cp -R "$SCALADOC_DIR"/. _site/api/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
