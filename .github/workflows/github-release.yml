name: github-release.yml
on:
  push:
    branches:
      - main
      - bf/release-action-fix
jobs:

  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check and Validate Version
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION=$(grep "release_version" project/build.properties | cut -d'=' -f2 | xargs)
          echo "File's local version: $LOCAL_VERSION"
          
          LATEST_RELEASE_JSON=$(gh api repos/${{ github.repository }}/releases/latest 2>/dev/null || echo '{"message": "Not Found"}')
          
          if echo "$LATEST_RELEASE_JSON" | grep -q "Not Found"; then
            echo "ℹ️ No previous release found on github. setting the last version to 0.0.0"
            LATEST_TAG="0.0.0"
          else
            LATEST_TAG=$(echo "$LATEST_RELEASE_JSON" | jq -r '.tag_name' | sed 's/^v//')
          fi
          
          echo "Last release version on GitHub: $LATEST_TAG"
          
          if [ "$LOCAL_VERSION" = "$LATEST_TAG" ]; then
            echo "❌ ERROR: The file's version ($LOCAL_VERSION) is equal to the last release version ($LATEST_TAG)!"
            echo "Edit the build.properties to update the versione before merging in main"
            exit 1
          fi
          
          HIGHEST_VERSION=$(printf '%s\n%s' "$LOCAL_VERSION" "$LATEST_TAG" | sort -V | tail -n1)
          
          if [ "$HIGHEST_VERSION" != "$LOCAL_VERSION" ]; then
            echo "❌ ERROR: The version in build.properties ($LOCAL_VERSION) is LOWER than the one of the latest release ($LATEST_TAG)!"
            echo "Insert a valid and higher version than the current one."
            exit 1
          fi
          
          echo "✅ Executing release of v$LOCAL_VERSION"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
          - os: windows-latest
            suffix: win
          - os: macos-latest
            suffix: mac
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup SBT
        uses: sbt/setup-sbt@v1
      - name: Build Fat JAR
        run: sbt assembly
        shell: bash
      - name: Rename JAR with OS suffix
        shell: bash
        run: |
          SRC=$(find target/out/jvm -name "MonadCore2D-assembly-*.jar" | head -n1)
          DEST="target/out/jvm/MonadCore2D-assembly-${VERSION}-${{ matrix.suffix }}.jar"
          echo "Renaming $SRC -> $DEST"
          mv "$SRC" "$DEST"
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.suffix }}
          path: target/out/jvm/MonadCore2D-assembly-${{ env.VERSION }}-${{ matrix.suffix }}.jar

  release:
    needs: [ check-version, build ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Quarkdown
        run: curl -fsSL https://raw.githubusercontent.com/quarkdown-labs/get-quarkdown/refs/heads/main/install.sh | sudo env "PATH=$PATH" bash
      - name: Generate PDF Documentation
        run: quarkdown c docs/main.qd --pdf --out-name="documentation"
      - name: Download all JAR artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.jar
            quarkdown-output/documentation.pdf