name: scala-tests.yml
on:
  push:
    branches:
    # run on any branch
    #- main
    #- development
  pull_request:
    branches:
      - main
      - development
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java and sbt Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Install Xvfb and Fonts
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-dejavu

      - name: Run unit and integration tests
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sbt test
