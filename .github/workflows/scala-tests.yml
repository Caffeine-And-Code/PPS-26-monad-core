name: scala-tests.yml
on:
  push:
    branches:
      # run on any branch
      #- master
      #- development
  pull_request:
    branches:
      - master
      - development
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java and sbt Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Run tests
        run: sbt test
        with:
          fail_ci_if_error: true