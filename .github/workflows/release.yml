name: release.yml
on:
  push:
    branches:
      - main
      - f/ci-cd-pipeline
  pull_request:
    branches:
      - main
jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1


      - name: Build Fat JAR
        run: sbt assembly


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Quarkdown
        run: npm install -g quarkdown

      - name: Generate PDF Documentation
        run: quarkdown input.qd -o documentazione.pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/out/jvm/scala-3.8.4/monadcore2d/MonadCore2D-assembly-**.jar
            documentazione.pdf